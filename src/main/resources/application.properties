# ============================================================
# Spring AI Demo — Application Configuration
# ============================================================

server.port=8080

# ------------------------------------------------------------
# OpenAI (ChatGPT) credentials
# Set your key here OR export the environment variable:
#   export OPENAI_API_KEY=sk-...
# ------------------------------------------------------------
spring.ai.openai.api-key=${OPENAI_API_KEY:your-api-key-here}

# GPT model to use (gpt-4o is recommended)
spring.ai.openai.chat.options.model=gpt-4o

# Max tokens in the response
spring.ai.openai.chat.options.max-tokens=1024

# Temperature (0.0 = deterministic, 1.0 = creative)
spring.ai.openai.chat.options.temperature=0.7

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
logging.level.org.springframework.ai=DEBUG
