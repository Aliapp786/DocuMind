# ============================================================
# Spring AI Demo — Application Configuration
# ============================================================

server.port=8080

# ------------------------------------------------------------
# Anthropic (Claude) credentials
# Set your key here OR export the environment variable:
#   export ANTHROPIC_API_KEY=sk-ant-...
# ------------------------------------------------------------
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:your-api-key-here}

# Claude model to use (claude-3-5-sonnet is recommended)
spring.ai.anthropic.chat.options.model=claude-3-5-sonnet-20241022

# Max tokens in the response
spring.ai.anthropic.chat.options.max-tokens=1024

# Temperature (0.0 = deterministic, 1.0 = creative)
spring.ai.anthropic.chat.options.temperature=0.7

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
logging.level.org.springframework.ai=DEBUG
